services:
  db:
    image: postgres:16-alpine
    container_name: commob_db
    environment:
      POSTGRES_DB: commob
      POSTGRES_USER: commob
      POSTGRES_PASSWORD: commob
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: commob_backend
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8080:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1

  mailpit:
    image: axllent/mailpit
    container_name: commob_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build: ./frontend
    container_name: commob_frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    ports:
      - "5173:5173"
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  db_data:
  frontend_node_modules:
  backend_vendor:
